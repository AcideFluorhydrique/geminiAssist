name: Test in an emulator

# Builds the debug APK and runs .github/scripts/emulator_test.py on Android emulators
# (API 29 and 35, phone and tablet). The app is plain Java, so the x86_64 images test
# the same code that runs on arm64 phones. Screenshots, logcat, the hosts restricted
# mode blocked and a summary are uploaded as artifacts, one per emulator.
# Manual only: the checks use the live Gemini site, which can change under us.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
        profile: [pixel_6, pixel_tablet]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: 4096M
          disk-size: 6G
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 .github/scripts/emulator_test.py apk/app-debug.apk results

      - name: Summary
        if: always()
        run: |
          echo "## API ${{ matrix.api-level }}, ${{ matrix.profile }}" >> "$GITHUB_STEP_SUMMARY"
          cat results/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No summary, the test did not finish." >> "$GITHUB_STEP_SUMMARY"
          gzip -9 results/logcat.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-api${{ matrix.api-level }}-${{ matrix.profile }}
          path: results/
